name: READER_SRIS
description: A Flutter application to convert PDF text to Speech offline.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0          # لاختيار ملف الـ PDF من الجهاز
  syncfusion_flutter_pdf: ^24.1.41 # لمعالجة واستخراج النصوص من الـ PDF (أوفلاين)
  flutter_tts: ^4.0.2          # لتحويل النص إلى كلام (تستخدم محرك الهاتف المحلي دون إنترنت)
  path_provider: ^2.1.1        # لتحديد مسارات حفظ ملفات الصوت
  permission_handler: ^11.1.0  # لإدارة صلاحيات الوصول للملفات

flutter:
  uses-material-design: true
